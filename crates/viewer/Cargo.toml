[package]
name = "plateau-crowd-viewer"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "plateau-crowd-viewer"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
plateau-gml.workspace = true
walkmap.workspace = true
crowd.workspace = true
traffic.workspace = true

[dependencies.bevy]
version = "0.16.1"
default-features = false
features = [
  "std", "async_executor", "multi_threaded", "bevy_log", "bevy_asset", "bevy_window", "bevy_winit",
  "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_ui", "bevy_ui_picking_backend", "bevy_text",
  "default_font", "tonemapping_luts", "ktx2", "zstd", "png", "x11",
]
