[package]
name = "plateau-crowd-viewer"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "plateau-crowd-viewer"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bytemuck = { version = "1", features = ["derive"] }
plateau-gml.workspace = true
walkmap.workspace = true
crowd.workspace = true
traffic.workspace = true
bevy_egui = { version = "0.34", default-features = false, features = ["default_fonts", "render"] }

[dependencies.bevy]
version = "0.16.1"
default-features = false
features = [
  "std", "async_executor", "multi_threaded", "bevy_log", "bevy_asset", "bevy_window", "bevy_winit",
  "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_ui", "bevy_ui_picking_backend", "bevy_text",
  "default_font", "tonemapping_luts", "ktx2", "zstd", "png", "x11",
]

# 場所の取得（HTTP・ファイル保存）はネイティブ版だけ
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
plateau-fetch.workspace = true

# Web 版（wasm32）: WebGL2 で描画する
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "Element", "MediaQueryList"] }
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.bevy]
version = "0.16.1"
default-features = false
features = ["webgl2", "web"]
