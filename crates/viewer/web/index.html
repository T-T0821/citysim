<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PLATEAU 人流シミュレーター Web デモ</title>
  <meta name="description" content="Project PLATEAU の 3D 都市モデル（銀座 4 丁目交差点）上で歩行者・車・バス・自転車と信号をブラウザでシミュレーションするデモ">
  <style>
    html, body { margin: 0; height: 100%; background: #9eb8d1; overflow: hidden;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    #bevy { display: block; width: 100%; height: 100%; outline: none; }
    #status { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px;
      align-items: center; justify-content: center; text-align: center; padding: 16px;
      color: #10202e; font-size: 16px; pointer-events: none; }
    #status.error { color: #8a1010; background: #f3e3e3; pointer-events: auto; }
    #status small { color: #33485c; max-width: 36em; line-height: 1.6; }
    .spinner { width: 36px; height: 36px; border: 4px solid #ffffff80; border-top-color: #10202e;
      border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #about { position: fixed; left: 8px; bottom: 6px; font-size: 12px; color: #10202ecc; }
    #about a { color: inherit; }
  </style>
</head>
<body>
  <canvas id="bevy" tabindex="0"></canvas>
  <div id="status">
    <div class="spinner"></div>
    <div>銀座 4 丁目交差点を読み込んでいます…</div>
    <small>3D 都市モデルから歩行空間・道路網・信号を作るので、数秒〜十数秒かかります。<br>
      WebGL2 に対応したブラウザ（PC の Chrome / Edge / Firefox / Safari）で開いてください。</small>
  </div>
  <div id="about">
    出典: 国土交通省 Project PLATEAU 3D 都市モデル（東京都 23 区, 2023 年度）を加工 ·
    <a href="https://github.com/T-T0821/citysim" target="_blank" rel="noopener">ソースコード</a>
  </div>
  <script type="module">
    import init from "./plateau-crowd-viewer.js";
    const status = document.getElementById("status");
    const hide = () => { if (!status.classList.contains("error")) status.style.display = "none"; };
    try {
      // init() の中で Rust の main が走り、モデルの読み込みとシミュレーションの準備まで同期で行う
      await init();
    } catch (e) {
      // bevy (winit) はイベントループに入るとき例外で制御を返す。これは正常なので無視する
      if (!String(e).includes("Using exceptions for control flow")) {
        status.classList.add("error");
        status.textContent = "起動できませんでした: " + e;
      }
    }
    requestAnimationFrame(() => requestAnimationFrame(hide));
  </script>
</body>
</html>
