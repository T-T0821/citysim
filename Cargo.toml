[workspace]
resolver = "2"
members = ["crates/plateau-gml", "crates/walkmap", "crates/crowd", "crates/cli", "crates/viewer"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
quick-xml = "0.36"
glam = "0.29"
anyhow = "1"
plateau-gml = { path = "crates/plateau-gml" }
walkmap = { path = "crates/walkmap" }
crowd = { path = "crates/crowd" }

[profile.release]
debug = false

# bevy は debug ビルドだと極端に遅いので依存クレートだけ最適化する
[profile.dev.package."*"]
opt-level = 2
