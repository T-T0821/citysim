[workspace]
resolver = "2"
members = ["crates/plateau-gml", "crates/walkmap", "crates/crowd", "crates/cli", "crates/viewer", "crates/traffic", "crates/fetch"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
quick-xml = "0.36"
glam = "0.29"
anyhow = "1"
plateau-gml = { path = "crates/plateau-gml" }
walkmap = { path = "crates/walkmap" }
crowd = { path = "crates/crowd" }
traffic = { path = "crates/traffic" }
plateau-fetch = { path = "crates/fetch" }

[profile.release]
debug = false

# bevy は debug ビルドだと極端に遅いので依存クレートだけ最適化する
[profile.dev.package."*"]
opt-level = 2

# Web 版（scripts/build-web.sh）: 配信サイズを縮める。
# シミュレーション本体（ワークスペースのクレート）は速さ優先の opt-level 3 のまま、依存クレート（bevy など）はサイズ優先
[profile.web]
inherits = "release"
lto = "thin"
codegen-units = 1
[profile.web.package."*"]
opt-level = "s"
