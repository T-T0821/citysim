# 銀座 4 丁目交差点周辺（testdata/ginza, --crop 35.67165,139.76500,220）の夕方シナリオ例。
#
# - 18:00 から 30 分間、地下鉄の出口 4 か所から帰宅・買い物客が出てきて、有楽町方面と範囲の縁へ向かう
# - 18:10 ごろ、東銀座（歌舞伎座）方面から終演後の観客がまとまって有楽町方面へ歩いてくる
# - 晴海通りの有楽町寄りで全面通行止め（工事）。--compare で通行止めの有無を比べられる
#
#   cargo run --release -- --gml testdata/ginza/53394601_bldg_6697_op.gml --gml testdata/ginza/53394601_tran_6697_op.gml \
#       --crop 35.67165,139.76500,220 --scenario scenarios/ginza-evening.toml --compare --export out/ginza-evening

[scenario]
name = "銀座 夕方の帰宅ラッシュと終演"
start = "18:00"
duration = "18:20"        # 開始から 20 分（1200 秒）
background_agents = 300   # 発生源とは別に通り抜ける人
vehicles = 30
zone_size = 20            # 集計区画 [m]

# rate は [時刻, 人/分] の折れ線。時刻は "HH:MM" か開始からの秒数。
[[source]]
name = "銀座駅 交差点北西口"
at = [35.671542, 139.764735]
radius = 6
rate = [["18:00", 10], ["18:05", 40], ["18:15", 40], ["18:20", 10]]
to = ["有楽町方面", "西", "北", "南", "東"]
weights = [3, 1, 1, 1, 1]

[[source]]
name = "銀座駅 交差点北東口"
at = [35.671542, 139.765354]
rate = [["18:00", 10], ["18:05", 30], ["18:15", 30], ["18:20", 10]]
to = ["有楽町方面", "北", "東"]

[[source]]
name = "銀座駅 交差点南西口"
at = [35.671165, 139.764668]
rate = [["18:00", 10], ["18:05", 30], ["18:15", 30], ["18:20", 10]]
to = ["有楽町方面", "南", "西"]

[[source]]
name = "銀座駅 交差点南東口"
at = [35.671111, 139.765354]
rate = [["18:00", 10], ["18:05", 30], ["18:15", 30], ["18:20", 10]]
to = ["有楽町方面", "南", "東"]

[[source]]
name = "東銀座方面から（終演後の観客）"
at = [35.669782, 139.767322]
radius = 8
rate = [["18:08", 0], ["18:10", 150], ["18:14", 150], ["18:18", 0]]
to = ["有楽町方面"]
speed = 1.2

# 行き先。ほかに範囲の縁の "東" "西" "南" "北" も使える。
[[destination]]
name = "有楽町方面"
at = [35.672863, 139.762733]
radius = 8

# 通行止め・工事。kind = "all"（全面）/ "sidewalk"（歩道のみ）/ "road"（車道のみ）
# 形は polygon（頂点列）/ rect（対角 2 点）/ line（折れ線 + width [m]）のどれか。
[[closure]]
name = "晴海通り 有楽町寄りの工事"
kind = "all"
line = [[35.671723, 139.764004], [35.672124, 139.764448]]
width = 8
